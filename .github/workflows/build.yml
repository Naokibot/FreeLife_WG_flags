name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build WorldGuard flags
        run: mvn -B -U verify
      - name: Test and build marine mobs
        run: mvn -B -U -f marine-mobs/pom.xml verify
      - name: Verify release jars
        run: |
          WG_JAR=target/FreeLifeWGFlags-1.3.0-Spigot-1.21.1.jar
          MARINE_JAR=marine-mobs/target/FreeLifeMarineMobs-1.0.0-Spigot-1.21.1.jar
          unzip -t "$WG_JAR"
          unzip -t "$MARINE_JAR"
          jar tf "$WG_JAR" | grep -q '^plugin.yml$'
          jar tf "$MARINE_JAR" | grep -q '^plugin.yml$'
          javap -verbose -classpath "$WG_JAR" com.sagakenichi.freelifewgflags.FreeLifeWGFlagsPlugin | grep 'major version: 65'
          javap -verbose -classpath "$MARINE_JAR" com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin | grep 'major version: 65'
          if jar tf "$WG_JAR" | grep -Eq '^com/sk89q/|^org/bukkit/'; then
            echo 'WorldGuard/WorldEdit/Bukkit classes must not be shaded into the flags plugin.' >&2
            exit 1
          fi
          if jar tf "$MARINE_JAR" | grep -Eq '^org/bukkit/'; then
            echo 'Bukkit classes must not be shaded into the marine plugin.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLifeWGFlags-1.3.0-Spigot-1.21.1
          path: target/FreeLifeWGFlags-1.3.0-Spigot-1.21.1.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLifeMarineMobs-1.0.0-Spigot-1.21.1
          path: marine-mobs/target/FreeLifeMarineMobs-1.0.0-Spigot-1.21.1.jar
          if-no-files-found: error
